[gcode_macro TUNE_SAD_TROMBONE]
gcode:
    # Womp 1: G4 (392 Hz)
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 392 }
    G4 P0.250
    M400
    SET_PIN PIN=BEEPER_pin VALUE=0
    G4 P0.030
    
    # Womp 2: Gb4 (370 Hz)
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 370 }
    G4 P0.250
    M400
    SET_PIN PIN=BEEPER_pin VALUE=0
    G4 P0.030
    
    # Womp 3: F4 (349 Hz)
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 349 }
    G4 P0.250
    M400
    SET_PIN PIN=BEEPER_pin VALUE=0
    G4 P0.030
    
    # Woooomp 4: E4 (329 Hz) sliding down to Eb4 (311 Hz)
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 329 }
    G4 P0.300
    M400
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 311 }
    G4 P0.500
    M400
    
    # Shutoff
    SET_PIN PIN=BEEPER_pin VALUE=0


[gcode_macro TUNE_COIN]
gcode:
    # Note 1: B5 (988 Hz) for 50ms
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 988 }
    G4 P0.050
    M400
    # Note 2: E6 (1319 Hz) for 300ms
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 1319 }
    G4 P0.300
    M400
    # Shutoff
    SET_PIN PIN=BEEPER_pin VALUE=0

    
[gcode_macro TUNE_VICTORY]
gcode:
    # Note 1, 2, 3: Rapid triplets (Bb5 - 932 Hz)
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 932 }
    G4 P0.080
    M400
    G4 P0.020 # Micro-rest to separate notes
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 932 }
    G4 P0.080
    M400
    G4 P0.020
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 932 }
    G4 P0.080
    M400
    G4 P0.020
    
    # Note 4: Hold Bb5 a bit longer
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 932 }
    G4 P0.240
    M400
    
    # Note 5: Ab5 (830 Hz)
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 830 }
    G4 P0.160
    M400
    
    # Note 6: Bb5 (932 Hz)
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 932 }
    G4 P0.160
    M400
    
    # Final Triumphant Note: C6 (1046 Hz)
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 1046 }
    G4 P0.400
    M400
    
    # Shutoff
    SET_PIN PIN=BEEPER_pin VALUE=0
  

[gcode_macro PLAY_FAST_SONG]
gcode:
    # We define the notes (Hz) and durations (ms) as a sequence
    # This executes entirely within Klipper's internal evaluation loop
    
    # Note 1
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 1046 } # C6
    G4 P50
    # Note 2
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 1175 } # D6
    G4 P50
    # Note 3
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0 / 1318 } # E6
